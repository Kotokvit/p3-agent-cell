[database]
DB_TYPE = sqlite3
PATH = /var/lib/gitea/data/gitea.db

[repository]
ROOT = /var/lib/gitea/repos

[server]
HTTP_PORT = 3000
DOMAIN = localhost
ROOT_URL = http://localhost:3000/

[security]
INSTALL_LOCK = true
SECRET_KEY = p3gitea2024secretkey32bytesx
INTERNAL_TOKEN = p3gitea2024internaltoken64bytesxxxxxx

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false

[log]
MODE = console
LEVEL = Info

[oauth2]
ENABLED = true
