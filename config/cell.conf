# P³ Agent Cell Configuration
# ~/.config/p3-agent-cell/cell.conf

[cell]
name = p3-agent-cell
image = p3-agent-cell:latest
hostname = p3-cell

[resources]
memory = 12g
cpus = 6
pids_limit = 4096

[security]
# Capabilities added inside the container (for package installation)
caps_add = SYS_ADMIN,NET_RAW
# All other capabilities are dropped
no_new_privileges = true

[isolation]
# What the agent CAN see
mount_workspace = ~/Стільниця/p3-agent-cell/workspace:/workspace:rw
# What the agent CANNOT see (never mounted)
# /home, /etc, /var, /root, /opt, /srv, SSH keys, browser profiles

[gpu]
devices = nvidia0,nvidiactl,nvidia-modeset,nvidia-uvm,nvidia-uvm-tools
driver_capabilities = compute,utility

[network]
mode = bridge  # Docker bridge network (internet, isolated from host LAN)

[bridge]
gist_id = 9c3e8078b48c4743593d945818264dd8
poll_interval = 5
# Token loaded from EnvironmentFile, not hardcoded
